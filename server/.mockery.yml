all: false
dir: testing
filename: '{{.InterfaceName | lower}}_mock.go'
force-file-write: true
formatter: gofmt
# formatter-options:
  # goimports:
  #   all-errors: false
  #   comments: true
  #   format-only: true
  #   fragment: false
  #   local-prefix: ""
  #   tab-indent: true
  #   tab-width: 8
generate: true
include-auto-generated: false
log-level: info
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: testing
recursive: false
require-template-schema-exists: true
template: testify
template-schema: '{{.Template}}.schema.json'
packages:
  github.com/pbloigu/gonfig/server/service:
    config:
      all: true
  github.com/pbloigu/gonfig/server/series:
    config:
      all: true
  github.com/pbloigu/gonfig/server/configurations:
    config:
      all: true
