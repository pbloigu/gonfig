components:
  schemas:
    Application:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Application.json
          format: uri
          readOnly: true
          type: string
        apiKey:
          readOnly: true
          type: string
        configuration:
          $ref: "#/components/schemas/Configuration"
        hostname:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: string
        ip:
          readOnly: true
          type: string
        measurements:
          items:
            type: string
          nullable: true
          type: array
        name:
          type: string
      required:
        - name
      type: object
    Configuration:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Configuration.json
          format: uri
          readOnly: true
          type: string
        data:
          type: string
        time:
          format: date-time
          readOnly: true
          type: string
      required:
        - data
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/LoginRequest.json
          format: uri
          readOnly: true
          type: string
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/LoginResponse.json
          format: uri
          readOnly: true
          type: string
        expiry:
          description: Token exipry in seconds.
          format: int64
          type: integer
        token:
          type: string
      required:
        - token
        - expiry
      type: object
    Measurement:
      additionalProperties: false
      properties:
        lastValue:
          $ref: "#/components/schemas/MeasurementValue"
        name:
          type: string
      required:
        - name
      type: object
    MeasurementValue:
      additionalProperties: false
      properties:
        data:
          type: string
        time:
          format: date-time
          readOnly: true
          type: string
      required:
        - data
      type: object
    MeasurementValues:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/MeasurementValues.json
          format: uri
          readOnly: true
          type: string
        measurement:
          $ref: "#/components/schemas/Measurement"
        page:
          format: int64
          type: integer
        pageSize:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
        values:
          items:
            $ref: "#/components/schemas/MeasurementValue"
          nullable: true
          type: array
      required:
        - measurement
        - values
        - page
        - pageSize
        - total
      type: object
  securitySchemes:
    apiKey:
      scheme: Bearer
      type: http
info:
  title: Gonfig API
  version: 1.0.0
openapi: 3.0.3
paths:
  /application:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Application"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}:
    delete:
      parameters:
        - description: Id of the application to delete.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to delete.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    get:
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    patch:
      parameters:
        - description: Id of the application to patch.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to patch.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Application"
              description: The application
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/configuration:
    post:
      parameters:
        - description: Id of the application.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Configuration"
              description: Configuration data
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/measurements:
    get:
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Measurement"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/measurements/{name}:
    get:
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
        - description: Name of the measurement.
          in: path
          name: name
          required: true
          schema:
            description: Name of the measurement.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasurementValues"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /applications:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Application"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /login:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
              description: Login credentials.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
                description: Bearer token.
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
  /logout:
    get:
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
