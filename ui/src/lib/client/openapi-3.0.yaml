components:
  schemas:
    Action:
      additionalProperties: false
      properties:
        description:
          type: string
        script:
          type: string
      required:
        - description
        - script
      type: object
    Application:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Application.json
          format: uri
          readOnly: true
          type: string
        apiKey:
          readOnly: true
          type: string
        configuration:
          $ref: "#/components/schemas/Configuration"
        hostname:
          readOnly: true
          type: string
        id:
          readOnly: true
          type: string
        ip:
          readOnly: true
          type: string
        isOnline:
          readOnly: true
          type: boolean
        name:
          type: string
        series:
          items:
            type: string
          nullable: true
          readOnly: true
          type: array
      required:
        - name
      type: object
    Configuration:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Configuration.json
          format: uri
          readOnly: true
          type: string
        data:
          type: string
        time:
          format: date-time
          readOnly: true
          type: string
      required:
        - data
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          example: Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          nullable: true
          type: array
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          example: https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          example: 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          example: Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          example: https://example.com/errors/example
          format: uri
          type: string
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/LoginRequest.json
          format: uri
          readOnly: true
          type: string
        password:
          type: string
        username:
          type: string
      required:
        - username
        - password
      type: object
    LoginResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/LoginResponse.json
          format: uri
          readOnly: true
          type: string
        expiry:
          description: Token exipry in seconds.
          format: int64
          type: integer
        token:
          type: string
      required:
        - token
        - expiry
      type: object
    Series:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/Series.json
          format: uri
          readOnly: true
          type: string
        lastValue:
          nullable: true
          readOnly: true
          type: string
        lastValueTime:
          format: date-time
          nullable: true
          readOnly: true
          type: string
        name:
          maxLength: 128
          type: string
      required:
        - name
      type: object
    SeriesValue:
      additionalProperties: false
      properties:
        data:
          maxLength: 128
          nullable: true
          type: string
        time:
          format: date-time
          readOnly: true
          type: string
      type: object
    SeriesValues:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/SeriesValues.json
          format: uri
          readOnly: true
          type: string
        page:
          format: int64
          type: integer
        pageSize:
          format: int64
          type: integer
        series:
          $ref: "#/components/schemas/Series"
        total:
          format: int64
          type: integer
        values:
          items:
            $ref: "#/components/schemas/SeriesValue"
          nullable: true
          type: array
      required:
        - series
        - values
        - page
        - pageSize
        - total
      type: object
    StatusChangeTrigger:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: https://example.com/schemas/StatusChangeTrigger.json
          format: uri
          readOnly: true
          type: string
        actions:
          items:
            $ref: "#/components/schemas/Action"
          nullable: true
          type: array
      type: object
  securitySchemes:
    apiKey:
      scheme: Bearer
      type: http
info:
  title: Gonfig API
  version: 1.0.0
openapi: 3.0.3
paths:
  /application:
    post:
      operationId: addApplication
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Application"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}:
    delete:
      operationId: deleteApplication
      parameters:
        - description: Id of the application to delete.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to delete.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    get:
      operationId: getApplication
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    patch:
      operationId: updateApplication
      parameters:
        - description: Id of the application to patch.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to patch.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Application"
              description: The application
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/configuration:
    post:
      operationId: addConfiguration
      parameters:
        - description: Id of the application.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Configuration"
              description: Configuration data
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/online:
    get:
      operationId: isOnline
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/series:
    get:
      operationId: listSeries
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Series"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    post:
      operationId: addSeries
      parameters:
        - description: Id of the application for which to add a new series.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application for which to add a new series.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Series"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/series/{name}:
    get:
      operationId: getSeries
      parameters:
        - description: Id of the application for which to get the series.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application for which to get the series.
            type: string
        - description: Name of the series.
          in: path
          name: name
          required: true
          schema:
            description: Name of the series.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Series"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/series/{name}/values:
    get:
      operationId: listSeriesValues
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
        - description: Name of the series.
          in: path
          name: name
          required: true
          schema:
            description: Name of the series.
            type: string
        - description: Sort by.
          explode: false
          in: query
          name: sort
          schema:
            default: created
            description: Sort by.
            enum:
              - created
              - data
              - " recorded"
            type: string
        - description: Sort direction.
          explode: false
          in: query
          name: dir
          schema:
            default: desc
            description: Sort direction.
            enum:
              - asc
              - desc
            type: string
        - description: Page number. 1-based, please.
          explode: false
          in: query
          name: page
          schema:
            default: 1
            description: Page number. 1-based, please.
            format: int64
            minimum: 1
            type: integer
        - description: Page size.
          explode: false
          in: query
          name: size
          schema:
            default: 10
            description: Page size.
            format: int64
            maximum: 50
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesValues"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /application/{id}/trigger/status:
    delete:
      operationId: deleteStatusChangeTrigger
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    get:
      operationId: getStatusChangeTrigger
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChangeTrigger"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    post:
      operationId: addStatusChangeTrigger
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeTrigger"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChangeTrigger"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
    put:
      operationId: updateStatusChangeTrigger
      parameters:
        - description: Id of the application to get.
          in: path
          name: id
          required: true
          schema:
            description: Id of the application to get.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeTrigger"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusChangeTrigger"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /applications:
    get:
      operationId: listApplications
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Application"
                nullable: true
                type: array
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
  /login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
              description: Login credentials
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
                description: Bearer token.
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
  /logout:
    get:
      operationId: logout
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - apiKey: []
